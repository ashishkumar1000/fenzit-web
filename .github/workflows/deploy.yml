name: Deploy to Cloudflare

# Every push to main builds the SPA and deploys it to Cloudflare Workers.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running deploy to finish.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Cloudflare secrets live on this environment, not at repo level.
    environment: Fenzit-web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Gate the deploy on the same checks the standard requires before a commit.
      - name: Lint, format, styles, and test
        run: |
          bun run lint
          bun run format:check
          bun run check:styles
          bun run check:design-system
          bun run test

      # `deploy` runs `bun run build` (tsc + vite) and then `wrangler deploy`.
      # VITE_API_BASE_URL is public: it is compiled into the bundle, so it is a
      # plain value here, not a secret.
      - name: Build and deploy
        env:
          VITE_API_BASE_URL: https://api.fenzit.com
        run: bun run deploy
