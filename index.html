<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Fenzit — Jobs, Attendance and Leave Software</title>
    <meta name="description" content="Fenzit runs field jobs, attendance and leave in one app for AC service, plumbing, delivery and field teams. Launching 2026." />
    <meta name="author" content="Fenzit" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1868db" />
    <!-- The site is light-only; say so, or browsers may auto-darken on system dark mode. -->
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="https://fenzit.com/" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fenzit" />
    <meta property="og:title" content="Fenzit — Jobs, Attendance and Leave Software" />
    <meta property="og:description" content="Assign jobs, dispatch your team, and track every task in real time. Built for AC service employees, plumbers, delivery teams, and collection agents. Launching 2026." />
    <meta property="og:url" content="https://fenzit.com/" />
    <meta property="og:image" content="https://fenzit.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fenzit — run your jobs, attendance and leave in one place" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fenzit — Jobs, Attendance and Leave Software" />
    <meta name="twitter:description" content="Assign jobs, dispatch your team, and track every task in real time. Launching 2026." />
    <meta name="twitter:image" content="https://fenzit.com/og-image.png" />
    <meta name="twitter:image:alt" content="Fenzit — run your jobs, attendance and leave in one place" />

    <!-- Favicon: a real .ico for blind requests, the brand glyph for everyone else -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="360x360" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://fenzit.com/#organization",
            "name": "Fenzit",
            "url": "https://fenzit.com/",
            "email": "hello@fenzit.com",
            "description": "Software to run field jobs, attendance and leave in one app. Use it for jobs, for attendance and leave, or for both.",
            "logo": "https://fenzit.com/logo.png",
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "hello@fenzit.com",
              "availableLanguage": ["en"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://fenzit.com/#website",
            "url": "https://fenzit.com/",
            "name": "Fenzit",
            "publisher": { "@id": "https://fenzit.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "SoftwareApplication",
            "name": "Fenzit",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web, iOS, Android",
            "description": "Fenzit lets owners add employees, assign and dispatch jobs, and track every task in real time — for AC service employees, plumbers, delivery teams, and collection agents.",
            "url": "https://fenzit.com/",
            "publisher": { "@id": "https://fenzit.com/#organization" }
          }
        ]
      }
    </script>

    <!-- The country list is fetched from the API origin as soon as the page loads. Connect early. -->
    <link rel="preconnect" href="https://api.fenzit.com" crossorigin />
    <link rel="preload" href="./src/assets/web-fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Prerender public pages on hover, so navigation feels instant (Chrome, Edge). The prerender
         script fails the build if a public route is missing from this list. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": { "href_matches": "/pricing" },
            "eagerness": "moderate"
          },
